<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Official Tepuy Tricolor Circuit-T Icon (Faithful Vector of tepuy.unc.edu.ve/favicon.ico) -->
  <!-- Blue Top Bar with Terminal Nodes -->
  <line x1="9" y1="9" x2="55" y2="9" stroke="#0072BC" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="9" cy="9" r="5" fill="#0072BC"/>
  <circle cx="55" cy="9" r="5" fill="#0072BC"/>

  <!-- Yellow Left Outer Trace -->
  <path d="M12 21 H24 V56" stroke="#E5B80B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="11" cy="21" r="4.2" fill="#E5B80B"/>
  <circle cx="24" cy="56" r="4.2" fill="#E5B80B"/>

  <!-- Yellow Left Inner Trace -->
  <path d="M21 15 H29 V50" stroke="#E5B80B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="15" r="3.8" fill="#E5B80B"/>
  <circle cx="29" cy="50" r="3.8" fill="#E5B80B"/>

  <!-- Red Right Inner Trace -->
  <path d="M44 16 H36 V48" stroke="#C81E2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="45" cy="16" r="3.8" fill="#C81E2B"/>
  <circle cx="36" cy="48" r="3.8" fill="#C81E2B"/>

  <!-- Red Right Outer Trace -->
  <path d="M53 23 H41 V55" stroke="#C81E2B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="54" cy="23" r="4.2" fill="#C81E2B"/>
  <circle cx="41" cy="55" r="4.2" fill="#C81E2B"/>
</svg>
